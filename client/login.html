<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Outfit', 'sans-serif'],
                },
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-indigo-100 via-purple-50 to-teal-50 min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel text-center max-w-sm w-full p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        <!-- Decorative blobs -->
        <div
            class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob">
        </div>
        <div
            class="absolute -bottom-10 -right-10 w-32 h-32 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-blob animation-delay-2000">
        </div>

        <div class="relative z-10">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-2">Welcome Back</h1>
            <p class="text-slate-500 text-sm mb-8">Please enter your details to sign in</p>

            <form id="loginForm" class="space-y-5">
                <div class="text-left">
                    <label
                        class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5 ml-1">Username</label>
                    <input type="text" id="username"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all font-medium text-slate-700"
                        placeholder="admin" required autofocus>
                </div>

                <div class="text-left">
                    <label
                        class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5 ml-1">Password</label>
                    <input type="password" id="password"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all font-medium text-slate-700"
                        placeholder="••••••••" required>
                </div>

                <div id="errorMessage"
                    class="hidden bg-red-50 text-red-600 text-xs py-2 px-3 rounded-lg flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5 flex-shrink-0" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="errorText">Invalid credentials</span>
                </div>

                <button type="submit" id="loginBtn"
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 mt-2 flex justify-center items-center">
                    <span id="btnText">Sign In</span>
                    <svg id="btnSpinner" class="animate-spin ml-2 h-4 w-4 text-white hidden"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>

            <p class="mt-8 text-xs text-slate-400">© 2024 Mongo Bill API</p>
        </div>
    </div>

    <script>

        const BASE_URL = 'https://asg-ahmad.vercel.app';

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = 'index.html';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading State
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = 'Signing In...';
            btnSpinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            const username = usernameInput.value;
            const password = passwordInput.value;

            try {
                const fetchUrl = `${BASE_URL}/api/auth/login`;
                console.log('Attempting login to:', fetchUrl);
                // alert('Debug: Fetching ' + fetchUrl); // Uncomment if console is hard to check on mobile

                const response = await fetch(fetchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('username', data.username);
                        setTimeout(() => { window.location.href = 'index.html'; }, 500);
                    } else {
                        throw new Error(data.error || 'Login failed');
                    }
                } else {
                    // Not JSON! Probably an HTML error page
                    const errorHtml = await response.text();
                    console.error('Server returned non-JSON response:', errorHtml);
                    throw new Error(`Server Error: Received HTML instead of JSON. (Status: ${response.status})`);
                }
            } catch (err) {
                // Show Error
                errorText.textContent = err.message;
                errorMsg.classList.remove('hidden');

                // Reset Button
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
